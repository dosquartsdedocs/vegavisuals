[build-system]
requires = ["hatchling==1.27.0"]
build-backend = "hatchling.build"

[project]
name = "vegavisuals"
dynamic = ["version"]
description = "Reproducible, themed Vega-Lite and Vega rendering through hardened Docker."
readme = "README.md"
requires-python = ">=3.10"
license = "GPL-3.0-only"
license-files = ["LICENSE", "THIRD_PARTY_NOTICES.md"]
authors = [
  { name = "dosquartsdedocs" }
]
keywords = ["vega", "vega-lite", "visualization", "docker", "mcp"]
classifiers = [
  "Operating System :: POSIX :: Linux",
  "Programming Language :: Python :: 3 :: Only",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
  "Programming Language :: Python :: 3.13",
  "Programming Language :: Python :: 3.14",
  "Topic :: Multimedia :: Graphics"
]
dependencies = [
  "PyYAML==6.0.3"
]

[project.urls]
Repository = "https://github.com/dosquartsdedocs/vegavisuals"
Issues = "https://github.com/dosquartsdedocs/vegavisuals/issues"
Security = "https://github.com/dosquartsdedocs/vegavisuals/security/policy"

[project.optional-dependencies]
mcp = ["mcp==1.29.0"]
dev = [
  "build==1.3.0",
  "hatchling>=1.27,<2"
]

[project.scripts]
vegavisuals = "vegavisuals.cli:main"

[tool.hatch.version]
path = "src/vegavisuals/_version.py"

[tool.hatch.build.targets.sdist]
include = [
  "/AGENTS.md",
  "/CONTRIBUTING.md",
  "/Dockerfile",
  "/LICENSE",
  "/hatch_build.py",
  "/Makefile",
  "/README.md",
  "/scripts",
  "/SECURITY.md",
  "/THIRD_PARTY_NOTICES.md",
  "/examples",
  "/mcp-factory.yml",
  "/pyproject.toml",
  "/src",
  "/tests",
  "/.vegavisuals.yml",
  "/.vegavisuals.lock.json"
]

[tool.hatch.build.targets.wheel]
packages = ["src/vegavisuals"]

[tool.hatch.build.targets.wheel.force-include]
"mcp-factory.yml" = "vegavisuals/factory/mcp-factory.yml"

[tool.hatch.build.targets.wheel.hooks.custom]
path = "hatch_build.py"
