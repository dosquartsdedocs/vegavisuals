schema_version: 1
name: vegavisuals
version: 0.3.1
kind: codex-mcp-factory
description: Hardened Docker rendering for themed Vega-Lite and Vega visualizations.
license: GPL-3.0-only
repository: https://github.com/dosquartsdedocs/vegavisuals
factory_assets: src/vegavisuals/assets
workspace_rule:
  binding: consumer
  consumer_root: .
  source_paths:
    - .vegavisuals.yml
  generated_paths:
    - .cache/vegavisuals
    - .vegavisuals.lock.json
    - .unaltraweb/receipts/vegavisuals.json
  init_creates:
    - .cache/vegavisuals
    - .vegavisuals.yml
  allowed_external_writes: []
runtime:
  kind: python
  package_manager: pip
  package: vegavisuals[mcp]
  module: vegavisuals
  mcp_version: 1.29.0
transport:
  type: stdio
  command: [make, --no-print-directory, -C, "${factoryRoot}", mcp-stdio]
  env:
    MCP_CONSUMER_WORKSPACE: "${workspaceFolder}"
commands:
  build: [make, mcp-build]
  init: [bash, "${factoryRoot}/scripts/factory-launcher", init, "${workspaceFolder}"]
  check: [make, mcp-check]
  tests: [make, tests]
  smoke: [make, mcp-smoke]
  down: [bash, "${factoryRoot}/scripts/factory-launcher", down, "${workspaceFolder}"]
  update:
    - bash
    - ${factoryRoot}/scripts/factory-launcher
    - update
  release_status:
    - bash
    - ${factoryRoot}/scripts/factory-launcher
    - release-status
  install_check:
    - bash
    - ${factoryRoot}/scripts/factory-launcher
    - install-check
  install_codex_mcp:
    - bash
    - ${factoryRoot}/scripts/factory-launcher
    - install-codex-mcp
    - ${workspaceFolder}
  factory_check:
    - bash
    - ${factoryRoot}/scripts/factory-launcher
    - factory-check
  serve: [bash, "${factoryRoot}/scripts/factory-launcher", serve, "${workspaceFolder}"]
  manifest:
    - bash
    - ${factoryRoot}/scripts/factory-launcher
    - manifest
  render:
    - bash
    - ${factoryRoot}/scripts/factory-launcher
    - render
    - ${workspaceFolder}
  render_all:
    - bash
    - ${factoryRoot}/scripts/factory-launcher
    - render-all
    - ${workspaceFolder}
mcp:
  server_name: vegavisuals
  transport: stdio
  consumer_root_fixed_at_startup: true
  required_tools:
    - initialize_project
    - validate_visualization
    - render_visualization
    - render_visualization_text
    - visualization_status
    - visualization_check
    - render_visualizations
    - theme_inventory
    - compatibility_status
    - factory_check
    - release_status
    - update
    - factory_manifest
  resources:
    - vegavisuals://agent-guide
    - vegavisuals://themes
    - vegavisuals://compatibility
    - vegavisuals://project/status
    - vegavisuals://project/check
    - vegavisuals://factory/check
    - vegavisuals://release
    - vegavisuals://factory-manifest
discovery:
  file: mcp-factory.yml
  suggested_scan_roots:
    - ~/git
  checkout_required_for_make_lifecycle: true
release:
  default: v0.3.1
  profile: vl-convert-1.9.0
  family: benizar
defaults:
  profile: vl-convert-1.9.0
  family: benizar
contracts:
  manifest: 1
  lock: 2
  inline_cache: 2
  receipt: 1
  mcp_errors: typed-application-result
