schema_version: 1
name: vegavisuals
version: 0.3.0
kind: codex-mcp-factory
description: Hardened Docker rendering for themed Vega-Lite and Vega visualizations.
license: GPL-3.0-only
repository: https://github.com/dosquartsdedocs/vegavisuals
factory_assets: src/vegavisuals/assets
workspace_rule:
  consumer_root: .
  source_paths:
    - .vegavisuals.yml
  generated_paths:
    - .cache/vegavisuals
    - .vegavisuals.lock.json
  init_creates:
    - .cache/vegavisuals
    - .vegavisuals.yml
  allowed_external_writes: []
runtime:
  kind: python
  package_manager: pip
  package: vegavisuals[mcp]
  module: vegavisuals
  mcp_version: 1.29.0
transport:
  type: stdio
  command:
    - bash
    - ${factoryRoot}/scripts/factory-launcher
    - ${workspaceFolder}
    - serve
commands:
  build:
    - bash
    - ${factoryRoot}/scripts/factory-launcher
    - ${workspaceFolder}
    - build
  init:
    - bash
    - ${factoryRoot}/scripts/factory-launcher
    - ${workspaceFolder}
    - init
  check:
    - bash
    - ${factoryRoot}/scripts/factory-launcher
    - ${workspaceFolder}
    - check
  tests:
    - bash
    - ${factoryRoot}/scripts/factory-launcher
    - ${workspaceFolder}
    - tests
  smoke:
    - bash
    - ${factoryRoot}/scripts/factory-launcher
    - ${workspaceFolder}
    - smoke
  down:
    - bash
    - ${factoryRoot}/scripts/factory-launcher
    - ${workspaceFolder}
    - down
  update:
    - bash
    - ${factoryRoot}/scripts/factory-launcher
    - ${workspaceFolder}
    - update
  release_status:
    - bash
    - ${factoryRoot}/scripts/factory-launcher
    - ${workspaceFolder}
    - release-status
  install_check:
    - bash
    - ${factoryRoot}/scripts/factory-launcher
    - ${workspaceFolder}
    - install-check
  install_codex_mcp:
    - bash
    - ${factoryRoot}/scripts/factory-launcher
    - ${workspaceFolder}
    - install-codex-mcp
  factory_check:
    - bash
    - ${factoryRoot}/scripts/factory-launcher
    - ${workspaceFolder}
    - factory-check
  serve:
    - bash
    - ${factoryRoot}/scripts/factory-launcher
    - ${workspaceFolder}
    - serve
  client_config:
    - bash
    - ${factoryRoot}/scripts/factory-launcher
    - ${workspaceFolder}
    - client-config
  manifest:
    - bash
    - ${factoryRoot}/scripts/factory-launcher
    - ${workspaceFolder}
    - manifest
  render:
    - bash
    - ${factoryRoot}/scripts/factory-launcher
    - ${workspaceFolder}
    - render
  render_all:
    - bash
    - ${factoryRoot}/scripts/factory-launcher
    - ${workspaceFolder}
    - render-all
mcp:
  server_name: vegavisuals
  transport: stdio
  consumer_root_fixed_at_startup: true
  required_tools:
    - initialize_project
    - validate_visualization
    - render_visualization
    - render_visualization_text
    - visualization_status
    - visualization_check
    - render_visualizations
    - theme_inventory
    - compatibility_status
    - factory_check
    - release_status
    - update
    - factory_manifest
  resources:
    - vegavisuals://agent-guide
    - vegavisuals://themes
    - vegavisuals://compatibility
    - vegavisuals://project/status
    - vegavisuals://project/check
    - vegavisuals://factory/check
    - vegavisuals://release
    - vegavisuals://factory-manifest
discovery:
  file: mcp-factory.yml
  suggested_scan_roots:
    - ~/git
  checkout_required_for_make_lifecycle: true
release:
  default: v0.3.0
  profile: vl-convert-1.9.0
  family: benizar
defaults:
  profile: vl-convert-1.9.0
  family: benizar
contracts:
  manifest: 1
  lock: 2
  inline_cache: 2
  mcp_errors: typed-application-result
