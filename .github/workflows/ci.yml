name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ci-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  test:
    name: Python ${{ matrix.python }}
    runs-on: ubuntu-24.04
    timeout-minutes: 45
    strategy:
      fail-fast: false
      matrix:
        python: ["3.10", "3.14"]

    steps:
      - name: Check out repository
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false

      - name: Set up Python
        uses: actions/setup-python@5fda3b95a4ea91299a34e894583c3862153e4b97 # v7.0.0
        with:
          python-version: ${{ matrix.python }}

      - name: Install host dependencies
        run: python -m pip install --disable-pip-version-check .

      - name: Run host tests
        run: make tests PYTHON=python

      - name: Require Docker
        if: matrix.python == '3.14'
        run: docker info

      - name: Verify distributions and the real renderer
        if: matrix.python == '3.14'
        run: make tests-install docker-smoke PYTHON=python REQUIRE_DOCKER=1

      - name: Recheck committed render provenance
        if: matrix.python == '3.14'
        run: make check PYTHON=python
